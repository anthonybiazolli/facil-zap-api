version: '3.8'

services:
  # ============================================
  # INFRASTRUCTURE LAYER
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: facilzap-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./infrastructure/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks:
      - facilzap-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: facilzap-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - facilzap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6-jammy
    container_name: facilzap-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
      - ./infrastructure/docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js
    ports:
      - "27017:27017"
    networks:
      - facilzap-network
    command: ["--auth", "--bind_ip_all"]

  minio:
    image: minio/minio:latest
    container_name: facilzap-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - facilzap-network

  # ============================================
  # MICROSERVICES LAYER
  # ============================================
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: facilzap-api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY_SALT=${API_KEY_SALT}
      - SESSION_KEEPER_URL=http://session-keeper:3000
      - MESSAGE_QUEUE_URL=http://message-queue:3000
      - ANTI_BAN_URL=http://anti-ban-engine:3000
      - LEGAL_COMPLIANCE_URL=http://legal-compliance:3000
      - PAYMENT_GATEWAY_URL=http://payment-gateway:3000
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facilzap-network
    restart: unless-stopped

  session-keeper:
    build:
      context: .
      dockerfile: services/session-keeper/Dockerfile
    container_name: facilzap-session-keeper
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=${REDIS_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - WA_WEBHOOK_URL=${WA_WEBHOOK_URL}
      - SESSIONS_PATH=/app/sessions
    volumes:
      - sessions_data:/app/sessions
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - facilzap-network
    restart: unless-stopped

  message-queue:
    build:
      context: .
      dockerfile: services/message-queue/Dockerfile
    container_name: facilzap-message-queue
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
      - SESSION_KEEPER_URL=http://session-keeper:3000
      - ANTI_BAN_URL=http://anti-ban-engine:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      session-keeper:
        condition: service_started
    networks:
      - facilzap-network
    restart: unless-stopped

  anti-ban-engine:
    build:
      context: .
      dockerfile: services/anti-ban-engine/Dockerfile
    container_name: facilzap-anti-ban
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=${REDIS_URL}
      - MONGODB_URL=${MONGODB_URL}
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - facilzap-network
    restart: unless-stopped

  legal-compliance:
    build:
      context: .
      dockerfile: services/legal-compliance/Dockerfile
    container_name: facilzap-legal
    ports:
      - "3004:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_URL=${DB_URL}
      - ZAPSIGN_API_KEY=${ZAPSIGN_API_KEY}
      - ZAPSIGN_WEBHOOK_SECRET=${ZAPSIGN_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - facilzap-network
    restart: unless-stopped

  payment-gateway:
    build:
      context: .
      dockerfile: services/payment-gateway/Dockerfile
    container_name: facilzap-payments
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_URL=${DB_URL}
      - PIX_API_KEY=${PIX_API_KEY}
      - PIX_CLIENT_ID=${PIX_CLIENT_ID}
      - PIX_CLIENT_SECRET=${PIX_CLIENT_SECRET}
      - PIX_WEBHOOK_SECRET=${PIX_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - facilzap-network
    restart: unless-stopped

  # ============================================
  # FRONTEND
  # ============================================
  frontend:
    build:
      context: ../facil-zap-api-frontend
      dockerfile: Dockerfile
    container_name: facilzap-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - facilzap-network
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  mongo_data:
  minio_data:
  sessions_data:

networks:
  facilzap-network:
    driver: bridge
