global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']

  - job_name: 'message-queue'
    static_configs:
      - targets: ['message-queue:3000']

  - job_name: 'anti-ban-engine'
    static_configs:
      - targets: ['anti-ban-engine:3000']

  - job_name: 'legal-compliance'
    static_configs:
      - targets: ['legal-compliance:3000']

  - job_name: 'payment-gateway'
    static_configs:
      - targets: ['payment-gateway:3000']

  - job_name: 'session-keeper'
    static_configs:
      - targets: ['session-keeper:3000']